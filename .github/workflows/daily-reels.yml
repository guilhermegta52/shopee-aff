name: Promo Radar — Reels diários

on:
  pull_request:
    paths:
      - 'reels-worker/**'
      - '.github/workflows/daily-reels.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: dry tests or daily-publish (posts to Instagram)'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live-catalog-dry-run
          - daily-publish
          - instagram-check
          - ai-credentials-check
          - ai-presenter-preview
      approve_paid_ai:
        description: 'Approve ONE paid Kling 3.0 Standard generation: 5 seconds, sound off'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: promo-radar-reels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name != 'schedule' || vars.ENABLE_DAILY_REELS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      PROMO_RADAR_API: ${{ vars.PROMO_RADAR_API }}
      PIPER_VOICE: pt_BR-faber-medium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg, Piper, fonts and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet pillow piper-tts
          python -m piper.download_voices pt_BR-faber-medium
          npm install --prefix reels-worker --omit=dev --no-audit --no-fund
      - name: Check Instagram account and publishing access without posting
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'instagram-check'
        run: node reels-worker/instagram-account.mjs
      - name: Check AI API credentials (no spending, no publishing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ai-credentials-check'
        env:
          HF_KEY: ${{ secrets.HF_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          secret=os.environ.get('HF_KEY','').strip()
          if not secret:
              print('CONFIG_ERROR: HF_KEY secret is missing from repository Actions')
              sys.exit(1)
          if ':' not in secret or len(secret.split(':',1)[0])<3 or len(secret.split(':',1)[1])<8:
              print('CONFIG_ERROR: HF_KEY must use KEY_ID:KEY_SECRET syntax (see provider API instructions)')
              sys.exit(1)
          print('HF_KEY_FORMAT_OK — segredo encontrado e formato validado, SEM chamada à API, SEM cobrança, SEM publicação')
          PY
      - name: Verify daily budget and duplicate-attempt protection
        run: |
          python -m unittest discover -s reels-worker -p 'test_*.py'
          node --test reels-worker/test-instagram-account.mjs reels-worker/weekly-products.test.mjs
      - name: Render and validate, without publishing
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run')
        run: |
          python reels-worker/smoke_fixture.py
          TEST_PRODUCT=reels-worker/out/smoke-product.json TEST_IMAGE=reels-worker/out/smoke-image.jpg python reels-worker/daily.py
      - name: Test full pipeline against real Shopee offers, without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-catalog-dry-run'
        run: python reels-worker/daily.py
      - name: Generate one AI presenter preview without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ai-presenter-preview'
        env:
          HF_KEY: ${{ secrets.HF_KEY }}
          PRESENTER_MODE: ai
          ENABLE_PAID_AI_GENERATION: ${{ inputs.approve_paid_ai && 'true' || 'false' }}
        run: |
          test "$ENABLE_PAID_AI_GENERATION" = "true" || { echo "Paid AI approval is required"; exit 1; }
          test -n "$HF_KEY" || { echo "HF_KEY is missing"; exit 1; }
          python reels-worker/daily.py
      - name: Daily AI generation and Instagram publication
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily-publish' && inputs.approve_paid_ai)) && vars.ENABLE_DAILY_REELS == 'true'
        env:
          ENABLE_REAL_POSTING: 'true'
          HF_KEY: ${{ secrets.HF_KEY }}
          PRESENTER_MODE: ai
          ENABLE_PAID_AI_GENERATION: 'true'
        run: |
          test -n "$SHOPEE_APP_ID" && test -n "$SHOPEE_APP_SECRET"
          test -n "$INSTAGRAM_TOKEN" && test -n "$INSTAGRAM_ACCOUNT_ID"
          test -n "$BLOB_READ_WRITE_TOKEN"
          test -n "$HF_KEY"
          node reels-worker/instagram-account.mjs
          python reels-worker/daily_guard.py
          python reels-worker/daily.py --publish
      - name: Save render for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-radar-reel-${{ github.run_number }}
          path: |
            reels-worker/ai-daily-ledger.json
            reels-worker/out/selection.json
            reels-worker/history.json
            reels-worker/out/presenter.mp4
            reels-worker/out/presenter-request.json
            reels-worker/out/promo-reel.mp4
            reels-worker/out/result.json
            reels-worker/out/publish.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save generated and published product history even when publication fails
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily-publish' && inputs.approve_paid_ai)) && vars.ENABLE_DAILY_REELS == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add reels-worker/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: save published Promo Radar Reel"
            git push
          fi